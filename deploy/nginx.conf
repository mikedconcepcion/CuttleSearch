# CuttleSearch edge — TLS termination, rate limiting, optional API key.
#
# The binary stays minimal and read-only; the public-internet concerns
# (TLS, abuse control, quotas) live here at the edge. Bind the service to
# loopback (127.0.0.1:8787) and let nginx face the world.
#
#   include this server block from your nginx http {} context, or drop it in
#   /etc/nginx/sites-available/cuttlesearch and symlink it enabled.

# Per-IP token bucket: 10 req/s sustained, bursts absorbed below.
limit_req_zone $binary_remote_addr zone=cuttlesearch:10m rate=10r/s;

# HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name search.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name search.example.com;

    # --- TLS (point these at your certs / certbot output) ---
    ssl_certificate     /etc/letsencrypt/live/search.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/search.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # --- request caps (defense in depth; the binary also caps the line) ---
    client_max_body_size 16k;
    client_body_timeout  5s;
    client_header_timeout 5s;
    send_timeout         10s;

    # --- /health: cheap, unauthenticated, not rate-limited, never cached ---
    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # --- /search: rate-limited; optional API key; cacheable per query ---
    location = /search {
        limit_req zone=cuttlesearch burst=20 nodelay;

        # Optional API key (Algolia-style public APIs often omit this). Enforce
        # a key here if you want quotas/attribution. Uncomment to require it:
        # if ($http_authorization != "Bearer REPLACE_WITH_YOUR_KEY") {
        #     return 401 '{"error":{"code":"unauthorized","message":"missing or invalid API key"}}';
        # }

        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;

        # Hot-query cache: read-only GETs are safe to cache. Tune to taste; keep
        # it short so index updates surface quickly. (Requires a proxy_cache_path
        # in the http{} context to actually store responses.)
        # proxy_cache cuttlesearch_cache;
        # proxy_cache_valid 200 30s;
        # proxy_cache_key "$request_method$request_uri";
    }

    # Everything else: let the binary answer (404/405 with structured JSON).
    location / {
        limit_req zone=cuttlesearch burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }
}
